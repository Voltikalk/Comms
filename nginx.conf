server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Path to the compiled static assets on your Ubuntu server
    root /var/www/comms/dist;
    index index.html;

    # Domain name configuration
    server_name dabim.forgottenght.online;

    # Allow large payloads (photos, voice notes, files) up to 100MB
    client_max_body_size 100M;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve static assets or fallback to index.html for React Router / SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term immutable caching for hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Serve uploaded files directly via Nginx with immutable cache
    location /uploads/ {
        alias /var/www/comms/uploads/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse proxy API endpoints to Node
    location /api/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 100M;
    }

    # Do not cache index.html to ensure updated bundle hashes are always loaded on reload
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Reverse proxy Socket.io traffic to the local Node.js process running on port 3000
    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # The local backend Socket.io server
        proxy_pass http://127.0.0.1:3000;

        # Enable WebSocket upgrades
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Disable buffering and extend timeouts for stable WebSockets
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
