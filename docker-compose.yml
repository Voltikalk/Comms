services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: comms-backend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://mpjizafibhffabwybpgj.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1waml6YWZpYmhmZmFid3licGdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Nzg5MjIsImV4cCI6MjEwMjU1NDkyMn0.3vWuuMHqRAEUewP1FTFqsId_l6lUkZlik4R3rBjnfqI}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1waml6YWZpYmhmZmFid3licGdqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4Njk3ODkyMiwiZXhwIjoyMTAyNTU0OTIyfQ.iakbuMtRL1ivGECBe8774asYPt2lMrJDVxjfHFKhWTM}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-comms_jwt_access_secret_super_secure_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-comms_jwt_refresh_secret_super_secure_key_2026}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - comms_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://mpjizafibhffabwybpgj.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1waml6YWZpYmhmZmFid3licGdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Nzg5MjIsImV4cCI6MjEwMjU1NDkyMn0.3vWuuMHqRAEUewP1FTFqsId_l6lUkZlik4R3rBjnfqI}
    container_name: comms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - comms_net

volumes:
  uploads_data:
    driver: local

networks:
  comms_net:
    driver: bridge
